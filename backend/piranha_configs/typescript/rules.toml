[[rules]]
name = "delete_ts_definition"
query = """
(
  (export_statement) @stmt
  (#match? @stmt "^export\\\\s+const\\\\s+@flag_name\\\\s*=")
)
"""
replace_node = "stmt"
replace = ""
holes = ["flag_name"]
groups = ["ts_import_cleanup"]
is_seed_rule = true

[[rules]]
name = "delete_single_ts_import"
query = """
(
  (import_statement) @stmt
  (#match? @stmt "^import\\\\s*\\\\{\\\\s*@flag_name\\\\s*\\\\}\\\\s*from")
)
"""
replace_node = "stmt"
replace = ""
holes = ["flag_name"]
groups = ["ts_import_cleanup"]
is_seed_rule = true

# LaunchDarkly SDK call cleanup (verified): `X.variation|boolVariation("FLAG",
# ctx, true|false-literal)` in an `if` condition -> @treated literal, then the
# shared bool/if cleanup chain applies. Safety gates (all verified):
# - enclosing `if` only;
# - default arg must be a boolean literal (proves boolean intent; object/string
#   defaults like rate-limiter configs are left alone -> NO_CHANGES);
# - stringVariation/numberVariation/jsonVariation and *Detail variants are
#   intentionally NOT matched (non-boolean return would be corrupted).
[[rules]]
name = "ld_variation_to_literal"
query = """
(
  (call_expression
    function: (member_expression
      property: (property_identifier) @method
      (#match? @method "^(variation|boolVariation)$"))
    arguments: (arguments
      . (string
        (string_fragment) @key
        (#eq? @key "@flag_name"))
      (_) @ctx
      . [(true) (false)] @default)) @call
)
"""
replace_node = "call"
replace = "@treated"
holes = ["flag_name", "treated"]
groups = ["flag_seed"]
is_seed_rule = true

[[rules.filters]]
enclosing_node = "(if_statement) @stmt"

