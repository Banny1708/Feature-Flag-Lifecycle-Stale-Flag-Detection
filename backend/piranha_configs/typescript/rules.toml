groups = ["ts_bool_cleanup"]
is_seed_rule = false

[[rules]]
name = "x_and_false"
query = """((binary_expression left: (_) operator: "&&" right: (false)) @op)"""
replace_node = "op"
replace = "false"
groups = ["ts_bool_cleanup"]
is_seed_rule = false

[[rules]]
name = "false_or_x"
query = """((binary_expression left: (false) operator: "||" right: (_) @rhs) @op)"""
replace_node = "op"
replace = "@rhs"
groups = ["ts_bool_cleanup"]
is_seed_rule = false

[[rules]]
name = "x_or_false"
query = """((binary_expression left: (_) @lhs operator: "||" right: (false)) @op)"""
replace_node = "op"
replace = "@lhs"
groups = ["ts_bool_cleanup"]
is_seed_rule = false

[[rules]]
name = "true_or_x"
query = """((binary_expression left: (true) operator: "||" right: (_)) @op)"""
replace_node = "op"
replace = "true"
groups = ["ts_bool_cleanup"]
is_seed_rule = false

[[rules]]
name = "x_or_true"
query = """((binary_expression left: (_) operator: "||" right: (true)) @op)"""
replace_node = "op"
