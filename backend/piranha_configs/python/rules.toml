[[rules]]
name = "flag_to_literal"
query = """(
  (identifier) @flag_id
  (#eq? @flag_id "@flag_name")
)
"""
replace_node = "flag_id"
replace = "@treated"
holes = ['flag_name', 'treated']
groups = ["flag_seed"]
is_seed_rule = true
[[rules.filters]]
enclosing_node = "(if_statement) @stmt"
not_enclosing_node = "[(attribute) (subscript)] @n"
[[rules]]
name = "simplify_if_true"
query = """(
  (if_statement
    condition: (true)
    consequence: (block) @then
  ) @stmt
)
"""
replace_node = "stmt"
replace = "@then"
groups = ["py_if_cleanup"]
is_seed_rule = false
[[rules]]
name = "simplify_if_false_else"
query = """(
  (if_statement
    condition: (false)
    consequence: (block)
    alternative: (else_clause (block) @else)
  ) @stmt
)
"""
replace_node = "stmt"
replace = "@else"
groups = ["py_if_cleanup"]
is_seed_rule = false
[[rules]]
name = "simplify_if_false_no_else"
query = """(
  (if_statement
    condition: (false)
    consequence: (block)
  ) @stmt
)
"""
replace_node = "stmt"
replace = ""
groups = ["py_if_cleanup"]
is_seed_rule = false
[[rules]]
name = "true_and_x"
query = """((boolean_operator left: (true) "and" right: (_) @rhs) @op)"""
replace_node = "op"
replace = "@rhs"
groups = ["py_bool_cleanup"]
is_seed_rule = false
[[rules]]
name = "x_and_true"
query = """((boolean_operator left: (_) @lhs "and" right: (true)) @op)"""
replace_node = "op"
replace = "@lhs"
groups = ["py_bool_cleanup"]
is_seed_rule = false
[[rules]]
name = "false_and_x"
query = """((boolean_operator left: (false) "and" right: (_)) @op)"""
replace_node = "op"
replace = "False"
groups = ["py_bool_cleanup"]
is_seed_rule = false
[[rules]]
name = "x_and_false"
query = """((boolean_operator (_) @lhs "and" (false)) @op)"""
replace_node = "op"
replace = "False"
groups = ["py_bool_cleanup"]
is_seed_rule = false
[[rules]]
name = "false_or_x"
query = """((boolean_operator left: (false) "or" right: (_) @rhs) @op)"""
replace_node = "op"
replace = "@rhs"
groups = ["py_bool_cleanup"]
is_seed_rule = false
[[rules]]
name = "x_or_false"
query = """((boolean_operator left: (_) @lhs "or" right: (false)) @op)"""
replace_node = "op"
replace = "@lhs"
groups = ["py_bool_cleanup"]
is_seed_rule = false
[[rules]]
name = "true_or_x"
query = """((boolean_operator left: (true) "or" right: (_)) @op)"""
replace_node = "op"
replace = "True"
groups = ["py_bool_cleanup"]
is_seed_rule = false
[[rules]]
name = "x_or_true"
query = """((boolean_operator left: (_) "or" (true)) @op)"""
replace_node = "op"
replace = "True"
groups = ["py_bool_cleanup"]
is_seed_rule = false
[[rules]]
name = "not_true"
query = """((not_operator argument: (true)) @op)"""
replace_node = "op"
replace = "False"
groups = ["py_bool_cleanup"]
is_seed_rule = false
[[rules]]
name = "not_false"
query = """((not_operator argument: (false)) @op)"""
replace_node = "op"
replace = "True"
groups = ["py_bool_cleanup"]
is_seed_rule = false

# --- flag definition + single-name import cleanup ---
# Delete `FEATURE_X = ...` assignments where the flag is the assigned name.
[[rules]]
name = "delete_flag_definition"
query = """
(
  (expression_statement
    (assignment
      left: (identifier) @flag_id
      (#eq? @flag_id "@flag_name"))) @stmt
)
"""
replace_node = "stmt"
replace = ""
holes = ["flag_name"]
groups = ["py_import_cleanup"]
is_seed_rule = true

# Delete `from <mod> import FEATURE_X` when it is the ONLY imported name.
# Statement-text guard (#match?) keeps multi-name imports intact; those are a
# documented limitation (leftover reference -> verification FAILED, never corrupt).
[[rules]]
name = "delete_single_flag_import"
query = """
(
  (import_from_statement) @stmt
  (#match? @stmt "^from\\\\s+[\\\\w.]+\\\\s+import\\\\s+@flag_name\\\\s*$")
)
"""
replace_node = "stmt"
replace = ""
holes = ["flag_name"]
groups = ["py_import_cleanup"]
is_seed_rule = true

# LaunchDarkly SDK call cleanup (verified): `X.variation("FLAG", ctx, True|False)`
# in an `if` condition -> @treated literal, then the shared bool/if cleanup chain.
# Safety gates (all verified):
# - enclosing `if` only (assignment/return contexts are NOT cleaned);
# - default arg must be a boolean literal (proves boolean intent; object/string
#   defaults like rate-limiter configs are left alone -> NO_CHANGES);
# - variation_detail (object return), computed and env-derived keys excluded.
[[rules]]
name = "ld_variation_to_literal"
query = """
(
  (call
    function: (attribute
      attribute: (identifier) @method
      (#match? @method "^(variation)$"))
    arguments: (argument_list
      . (string
        (string_content) @key
        (#eq? @key "@flag_name"))
      (_) @ctx
      . [(true) (false)] @default)) @call
)
"""
replace_node = "call"
replace = "@treated"
holes = ["flag_name", "treated"]
groups = ["flag_seed"]
is_seed_rule = true

[[rules.filters]]
enclosing_node = "(if_statement) @stmt"
